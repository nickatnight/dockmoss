name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          rust-components: rustfmt,clippy,llvm-tools-preview

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.1
          fallback: none

      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | shasum -a 256 -c
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - run: pnpm check:task

      - run: cargo build
        working-directory: src-tauri

      # The only build with cfg(dev) off. Cargo caps lints for registry
      # dependencies, so a warning line here comes from this project or from
      # cargo itself. Colour stays off on the command so the grep can match.
      - name: Release build, no warnings
        run: |
          log="$RUNNER_TEMP/release-build.log"
          CARGO_TERM_COLOR=never pnpm tauri build --no-bundle 2>&1 | tee "$log"
          if grep -n '^warning' "$log"; then
            echo "::error::the release build printed warnings"
            exit 1
          fi

      - name: Coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm coverage:lcov

      # The Codecov CLI, pinned like gitleaks: checked against a sha256 kept
      # here and moved into place only if it matches. A failed download or a
      # mismatch fails this step, so the upload below doesn't run, and
      # continue-on-error keeps CI green. Bump the version and hash together.
      - name: Install Codecov CLI 11.3.2
        id: codecov_cli
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          CODECOV_CLI_SHA256: c7957a4c7a0f80eee58f53cd8ec7ec6cbdacffdbabb427bdfc2ce2a23f794164
        run: |
          dir="$RUNNER_TEMP/codecov"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL -o codecov.download https://cli.codecov.io/v11.3.2/macos/codecov
          if ! echo "$CODECOV_CLI_SHA256  codecov.download" | shasum -a 256 -c; then
            echo "::error::the Codecov CLI does not match its pinned sha256"
            exit 1
          fi
          chmod +x codecov.download
          mv codecov.download codecov

      # Keep this the job's last step: the action writes the token to
      # $GITHUB_ENV as CC_TOKEN, so every later step would see it. It runs the
      # CLI checked above (the action skips its own check when given a binary).
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: steps.codecov_cli.outcome == 'success'
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/codecov/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src-tauri/target/lcov.info
          disable_search: true
          fail_ci_if_error: true
