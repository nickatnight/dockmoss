<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- Dock Moss tray glyph: an app tile outline with moss over its bottom third, topped by three
       tufts. Black plus alpha only; macOS tints it as a template image. Regenerate with
       pnpm tauri icon at PNG size 44 (the png flag), then rename 44x44.png to icons/tray.png. -->
  <defs>
    <clipPath id="tile">
      <rect x="1" y="1" width="42" height="42" rx="11"/>
    </clipPath>
  </defs>
  <rect x="3" y="3" width="38" height="38" rx="9" fill="none" stroke="#000" stroke-width="4"/>
  <path clip-path="url(#tile)" fill="#000" d="M-1 25 H8.97 A4 4 0 0 1 12.58 27.29 A3 3 0 0 0 18.17 26.86 A4 4 0 0 1 22 24 A4 4 0 0 1 25.83 26.86 A3 3 0 0 0 31.42 27.29 A4 4 0 0 1 35.03 25 H45 V45 H-1 Z"/>
</svg>
