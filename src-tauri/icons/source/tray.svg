      <rect x="1" y="1" width="42" height="42" rx="11"/>
    </clipPath>
  </defs>
  <rect x="3" y="3" width="38" height="38" rx="9" fill="none" stroke="#000" stroke-width="4"/>
  <path clip-path="url(#tile)" fill="#000" d="M-1.5 27.5 A6.5 6.5 0 0 1 10.33 23.78 A3 3 0 0 0 13.8 24.88 A6.5 6.5 0 0 1 19.9 25.8 A3 3 0 0 0 23.69 25.64 A6.5 6.5 0 0 1 30.82 24.65 A3 3 0 0 0 34.3 24.01 A6.5 6.5 0 0 1 45.5 28.5 V45 H-1 Z"/>
</svg>
