[package]
name = "dock-moss"
version = "0.1.0"
description = "Grows moss on Dock icons for apps you haven't used in a while"
authors = ["Nick Kelly"]
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "dock_moss_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
