name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Every other run gets its own
# group, so a run on main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    # The crate links AppKit, so it only builds on macOS. The label is pinned so
    # an image migration can't change the toolchain under us.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history, as it does locally.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Pinned like the runner image, so a new Rust release can't add clippy
      # lints and turn main red with no code change. Bump it on purpose.
      - name: Install Rust
        env:
          RUST_TOOLCHAIN: 1.99.1
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | shasum -a 256 -c
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:task

      - run: cargo build
        working-directory: src-tauri

      # The only build with cfg(dev) off. Cargo caps lints for registry
      # dependencies, so a warning line here comes from this project.
      - name: Release build, no warnings
        run: |
          log="$RUNNER_TEMP/release-build.log"
          pnpm tauri build --no-bundle 2>&1 | tee "$log"
          if grep -n '^warning' "$log"; then
            echo "::error::the release build printed warnings"
            exit 1
          fi
