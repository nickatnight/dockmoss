<!-- Dock Moss app icon master: a stone app tile on the macOS icon grid (824 px tile, radius 185, on a 1024 canvas) with moss creeping up from the bottom edge and lower corners.
     Regenerate the bundle icons with: pnpm tauri icon src-tauri/icons/source/app-icon.svg (then delete the non-macOS outputs). -->
