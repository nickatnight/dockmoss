name: Setup
description: >-
  pnpm, Node 22 with the pnpm store cached, Rust 1.99.1 with rust-cache
  (unless rust is 'false'), then pnpm install. Run it after actions/checkout.

inputs:
  rust:
    description: Install Rust and restore its cache ('true' or 'false').
    default: 'true'
  rust-components:
    description: Comma-separated rustup components, such as rustfmt,clippy.
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 12.16.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm

    # Pinned like the runner image, so a new Rust release can't add clippy
    # lints and turn main red with no code change. Bump it on purpose.
    - name: Install Rust
      if: inputs.rust == 'true'
      shell: bash
      env:
        RUST_TOOLCHAIN: 1.99.1
        RUST_COMPONENTS: ${{ inputs.rust-components }}
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal ${RUST_COMPONENTS:+--component "$RUST_COMPONENTS"}
        rustup default "$RUST_TOOLCHAIN"

    # rust-cache keys on the calling job's id, so each job keeps its own
    # target dir (clippy, llvm-cov and release builds don't evict each other).
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.rust == 'true'
      with:
        workspaces: src-tauri

    - run: pnpm install --frozen-lockfile
      shell: bash
